name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Verification only reads source and dependency metadata. It must not write to
# the repo, publish Pages, or mint deployment tokens.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: full local gate
        run: npm run verify

      - name: deploy-path build
        env:
          VITE_BASE_PATH: /SAL0MANder-Web/
        run: npm run build

      - name: SPA fallback for share links
        run: cp dist/index.html dist/404.html

      - name: disable Jekyll processing
        run: touch dist/.nojekyll

      - name: deploy artifact gate
        run: npm run verify:artifact
