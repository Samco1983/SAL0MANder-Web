# Deploy the site to GitHub Pages.
#
# Chosen over Vercel/Netlify/Cloudflare for one reason: agents can SEE it.
# A failed deploy here is readable with `gh run view --log-failed`, in the same
# place the issues, commits, and evidence already live. Every other host puts
# build logs behind a separate dashboard and a separate account, which means a
# broken deploy has to be relayed by a human from a screenshot — the exact
# hand-off this project exists to remove.
#
# Watch a run:   gh run list --workflow=deploy.yml
# Read a failure: gh run view --log-failed

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. `pages`/`id-token` are what deploy-pages needs; nothing here
# may write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so one deploy at a time. Queued rather than cancelled: a
# cancelled deploy can leave the published site older than the queue implies.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The full gate, not just a build. A site that compiles but fails lint,
      # types, or tests is exactly the "green" this project keeps catching.
      - name: verify
        run: npm run verify

      # THIS RUNS BEFORE THE DEPLOY BUILD BECAUSE IT RUNS ONE ITSELF.
      #
      # sal0_championship.py shells out to `npm run build` to answer "does the
      # site build". With no VITE_BASE_PATH set, that build emits un-prefixed
      # asset paths — and vite's emptyOutDir wipes dist first, taking 404.html
      # with it. It used to run in the status-page step, i.e. AFTER every check
      # below had passed, so it destroyed the verified artifact and the wreckage
      # was what got uploaded. The live site was blank for three days and every
      # single run reported success, because nothing re-checks dist after the
      # last check. Reproduced exactly: 993 bytes prefixed with 404.html ->
      # 918 bytes un-prefixed without it.
      - name: championship snapshot (builds — must precede the deploy build)
        run: python3 scripts/lib/sal0_championship.py --json > /tmp/champ.json || true

      - name: build for the deploy path
        env:
          # The production site is served from the root of sal0mander.com.
          # The router, asset URLs, Unity build path, and share links all read
          # this value; src/config/deployBasePath.test.ts pins that behaviour.
          VITE_BASE_PATH: /
          # Without this, env.ts falls back to its 'local' default and the
          # PUBLIC site renders as a developer preview: the "Foundation
          # preview — placeholder visual design" banner, an "env: local ·
          # api: mock" footer, and every <PlaceholderNotice> listing what is
          # not built yet. All of that is gated on env.isProd, which is
          # VITE_APP_ENV === 'production' and had never been set anywhere.
          #
          # Same shape as the compression bug below: a default that is right
          # for a laptop is wrong for a deploy, and nothing fails — the site
          # simply tells teachers it is unfinished.
          VITE_APP_ENV: production
          # Emergency Pages-hosted WebGL build. Longer-term this can move back
          # to a CDN once Unity licensing is healthy enough for repeat builds.
          VITE_UNITY_BUILD_BASE_URL: /unity
          VITE_UNITY_BUILD_NAME: sal0-unity-webgl
          # The build committed under public/unity is UNCOMPRESSED —
          # sal0-unity-webgl.{data,framework.js,wasm}, no .br suffix. env.ts
          # defaults this to 'br' because that is Unity's own default, so
          # leaving it unset made every deploy request three files that are not
          # there. The loader is never compressed, so it resolved, the progress
          # bar reached 100%, and the student got "The game didn't load".
          # Nothing failed: build green, deploy green, site broken.
          VITE_UNITY_BUILD_COMPRESSION: none
          # Public endpoint only; Cloudflare Access and the Worker hold auth,
          # Make, and GitHub credentials. Configure this repository variable
          # after the protected Worker has been deployed.
          VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
        run: npm run build

      # Pages has no server-side rewrite, so a deep link like /play/SUN-42 —
      # which is every teacher's share link — would 404 on a hard load. Serving
      # index.html as the 404 page hands the URL to the client router instead.
      # Without this, share links work in-app and break when pasted, which is
      # the one way they are actually used.
      # The check that would have caught the above. Asserts the four files the
      # app will actually request exist in dist, using the same values the
      # build just used — so a compression, name, or path change that makes the
      # game unreachable fails here instead of on a student's screen.
      - name: verify the Unity build the app will request is present
        env:
          VITE_UNITY_BUILD_NAME: sal0-unity-webgl
          VITE_UNITY_BUILD_COMPRESSION: none
        run: |
          node -e '
            const fs = require("fs");
            const name = process.env.VITE_UNITY_BUILD_NAME;
            const c = process.env.VITE_UNITY_BUILD_COMPRESSION;
            const ext = c === "none" ? "" : "." + c;
            // The loader is never compressed; Unity ships it plain because it
            // is the script that decides how to fetch everything else.
            const wanted = [
              `dist/unity/Build/${name}.loader.js`,
              `dist/unity/Build/${name}.data${ext}`,
              `dist/unity/Build/${name}.framework.js${ext}`,
              `dist/unity/Build/${name}.wasm${ext}`,
            ];
            const missing = wanted.filter((f) => !fs.existsSync(f));
            if (missing.length) {
              console.error("Unity files the app will request are missing:");
              for (const f of missing) console.error("  " + f);
              console.error("Present in dist/unity/Build:");
              for (const f of fs.readdirSync("dist/unity/Build")) console.error("  " + f);
              process.exit(1);
            }
            console.log("Unity build present: " + wanted.length + " files.");
          '

      - name: Pages fallbacks and public route entry points
        run: npm run pages:fallback

      # Pages does not serve files under directories beginning with an
      # underscore unless this exists. Vite emits assets to /assets, but Unity
      # WebGL builds and any future _-prefixed path would vanish silently.
      - name: disable Jekyll processing
        run: touch dist/.nojekyll

      # Fail the deploy, never warn. Every problem this catches is invisible
      # in the unit suite and in the build's exit code — the site is simply
      # blank, or the share links 404 — so shipping past a warning here means
      # shipping the failure.
      - name: verify the artifact is servable from the deploy path
        env:
          VITE_BASE_PATH: /
        run: node scripts/verify-deploy-artifact.mjs dist "$VITE_BASE_PATH"

      # Walk the built site the way a visitor does, before it can be published.
      # The shape check above proves the files are right; this proves the shape
      # works — Pages has no rewrite, so every share link on a hard load is
      # answered with 404.html and the router has to recover the path itself.
      - name: walk every visitor path against the deploy shape
        env:
          VITE_BASE_PATH: /
        run: node scripts/verify-deployed-site.mjs dist

      # A status page that ships with the site.
      #
      # Every tool that answers "is anything blocked" lives in a terminal, so
      # the answer was only ever available by asking an agent. This puts it at a
      # URL the owner can open on a phone. Computed once here and passed in —
      # the scorer rebuilds and re-verifies, so calling it from inside the build
      # is both recursive and slow.
      - name: status page
        # ONLY writes status.html into dist. The championship snapshot is taken
        # in an earlier step ON PURPOSE — see the comment there. Nothing after
        # the deploy build may run a build, or it silently destroys the artifact
        # every check above just certified.
        run: node scripts/build-status-page.mjs dist /tmp/champ.json

      # THE LAST WORD, immediately before upload. Every check above ran earlier
      # than this point, so every one of them describes a dist that later steps
      # were free to replace — which is exactly how a blank site shipped past a
      # fully green pipeline for three days. This re-checks the bytes that are
      # actually about to be published, and it is deliberately the final step.
      - name: re-verify the exact bytes being uploaded
        env:
          VITE_BASE_PATH: /
        run: |
          test -f dist/404.html || { echo "::error::404.html is gone — something rebuilt dist after the SPA fallback step; share links would 404"; exit 1; }
          node scripts/verify-deploy-artifact.mjs dist "$VITE_BASE_PATH"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: deployment
        uses: actions/deploy-pages@v4

      # THE ONLY CHECK HERE THAT CAN FAIL FOR A REASON OUR REPO CANNOT SEE.
      #
      # Every other step inspects dist/ — our own output, on our own runner,
      # before anything ships. That is a mirror. It reported success for three
      # days while the published site was blank and every share link 404'd.
      # This one asks the live URL, after deployment, over the public internet,
      # and asserts on CONTENT rather than status: a 200 means a server
      # answered, not that a student got a lesson.
      - name: verify the PUBLISHED site, not our copy of it
        run: node scripts/verify-live-site.mjs "${{ steps.deployment.outputs.page_url }}"
