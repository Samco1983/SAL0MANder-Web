<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Mystery Graph player</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f0ec;color:#193d46;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;padding:25px;text-align:center;background:#f8f5e9}h1{font-size:25px;letter-spacing:-.03em;margin:0 0 10px}p{font-size:14px;line-height:1.65;color:#4b6c61}progress{width:min(300px,75vw);height:15px;accent-color:#127e80}#error{position:absolute;inset:0;padding:24px;place-content:center;text-align:center;background:#f8f5e9}button,a{display:inline-block;border:1px solid #176e70;border-radius:8px;background:#127e80;color:#fffef4;padding:13px 20px;min-height:48px;font:700 15px system-ui;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #b97321;outline-offset:4px}[hidden]{display:none!important}#error:not([hidden]){display:grid}#percent{font-variant-numeric:tabular-nums}
</style><script src="config.js" defer></script><script src="player.js" defer></script></head><body>
<canvas id="unity-canvas" tabindex="0" aria-label="Mystery Graph. Plot x across, then y up or down. Tap or drag to an intersection and release, or use the x/y buttons and Lock point. Keyboard: arrows move; Enter locks; Backspace undoes. After the reveal, fly in all directions with WASD, arrows or drag. Regular shots fire automatically. Hold the mouse button, Z or the charge button, then release to blast. Space or Pause pauses. Easy starts with four shields and 12 seconds of larger, stronger rapid shots; Hard has faster attacks and 2× battle points. Each broken glass section drops a power-up: catch a cyan gem for larger, stronger rapid shots or a green gem for a shield. Break the purple shell to save your creation. Graph and earned progress save in this browser; an unfinished battle restarts after closing."></canvas>
<div id="loading" role="status"><h1>A mystery is taking shape</h1><p>Your coordinate adventure is nearly ready.</p><progress id="progress" max="1" value="0" aria-label="Game download"></progress><p id="percent">Starting download…</p><p id="cancel-note">You can use Back to cancel.</p></div>
<div id="error" role="alert" hidden><h1>The game couldn’t start</h1><p id="error-message"></p><button id="retry" type="button">Try again</button></div>
</body></html>
