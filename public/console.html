<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAL0MANder — Console</title>
<style>
  :root {
    --bg:#12131a; --card:#1c1e28; --line:#2c2f3d; --text:#f2f3f7; --dim:#9ba2b4;
    --bad:#ff6b6b; --good:#4ade80; --warn:#fbbf24; --go:#3b82f6;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:16px 14px 48px; max-width:640px; margin-inline:auto; }
  h1 { font-size:19px; margin:0 0 2px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim);
    margin:26px 0 10px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px; }
  .card.bad { border-left:3px solid var(--bad); }
  .card.good { border-left:3px solid var(--good); }
  .card.warn { border-left:3px solid var(--warn); }
  .headline { font-weight:600; margin-bottom:3px; }
  .detail { color:var(--dim); font-size:14px; }
  .who { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--line); }
  .who:last-child { border-bottom:0; }
  .who .name { font-weight:600; }
  .who .what { color:var(--dim); font-size:13.5px; text-align:right; flex:1; }
  button { width:100%; min-height:52px; border-radius:12px; border:1px solid var(--line);
    background:var(--go); color:#fff; font-size:16px; font-weight:600; margin-bottom:9px;
    cursor:pointer; padding:14px; text-align:left; }
  button .bhead { display:block; }
  button .bwhy { display:block; font-weight:400; font-size:13px; opacity:.85; margin-top:2px; }
  button:disabled { background:var(--card); color:var(--dim); cursor:default; }
  button:active:not(:disabled) { transform:scale(.99); }
  a { color:#7dd3fc; }
  .stamp { color:var(--dim); font-size:12px; margin-top:22px; text-align:center; }
  .loading { color:var(--dim); }
</style>
</head>
<body>
<h1>SAL0MANder</h1>
<div class="sub">Live. Nothing on this page is remembered — every line is re-checked when you open it.</div>

<h2>What's broken</h2>
<div id="broken"><div class="card"><span class="loading">checking…</span></div></div>

<h2>Who's working</h2>
<div class="card" id="who"><span class="loading">checking…</span></div>

<h2>Go</h2>
<div id="buttons"></div>

<div class="stamp" id="stamp"></div>

<script>
const REPO = 'Samco1983/SAL0MANder-Web';
const API = 'https://api.github.com/repos/' + REPO;
const SITE = 'https://samco1983.github.io/SAL0MANder-Web/';

const el = (id) => document.getElementById(id);
const ago = (iso) => {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const d = Math.floor(h / 24);
  return d + (d === 1 ? ' day ago' : ' days ago');
};
const card = (cls, headline, detail) =>
  `<div class="card ${cls}"><div class="headline">${headline}</div><div class="detail">${detail}</div></div>`;

async function gh(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}

/*
 * Asks the live site for its own homepage and reads the BYTES. Deliberately not
 * "did it return 200" — the site answered 200 for three days while serving a
 * blank page, so status proves only that a server replied. If the document does
 * not reference scripts under /SAL0MANder-Web/, every asset 404s and a student
 * gets nothing.
 */
async function checkSite() {
  try {
    const r = await fetch(SITE + '?_=' + Date.now(), { cache: 'no-store' });
    const html = await r.text();
    const refs = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m => m[1]).filter(u => u.endsWith('.js'));
    const bad = refs.filter(u => u.startsWith('/') && !u.startsWith('/SAL0MANder-Web/'));
    if (!refs.length) return { ok:false, headline:'The website is blank', detail:'The page loads but contains no app. Students see an empty screen.' };
    if (bad.length)  return { ok:false, headline:'The website is blank', detail:'It loads, but every file it needs is at the wrong address, so nothing appears. Share links are dead too.' };
    return { ok:true, headline:'The website works', detail:'It loads the lesson and share links resolve.' };
  } catch (e) {
    return { ok:null, headline:'Could not reach the website', detail:'No answer from the server. That is not the same as broken — try again in a minute.' };
  }
}

async function load() {
  const out = [];
  const [runs, prs, site] = await Promise.all([
    gh('/actions/runs?per_page=60').catch(() => null),
    gh('/pulls?state=open').catch(() => null),
    checkSite(),
  ]);

  out.push(card(site.ok === true ? 'good' : site.ok === null ? 'warn' : 'bad', site.headline, site.detail));

  if (runs) {
    const workers = runs.workflow_runs.filter(r => /Worker/i.test(r.name) && r.conclusion);
    const failed = workers.filter(r => r.conclusion === 'failure');
    if (workers.length && failed.length === workers.length) {
      /*
       * Says "at least", because this only sees the most recent page of runs.
       * The first draft reported "has not worked since 1 day ago" off the oldest
       * run it happened to fetch, when the real streak was three days — a page
       * whose whole job is telling the truth must not understate the thing it is
       * reporting. Where the window limits us, say so.
       */
      out.push(card('bad', 'The overnight helper never runs',
        `Its last ${workers.length} attempts in a row all failed — at least ${ago(workers[workers.length-1].created_at).replace(' ago','')} of nothing getting done. It is not helping at all right now.`));
    } else if (failed.length) {
      out.push(card('warn', 'The overnight helper is unreliable',
        `${failed.length} of its last ${workers.length} attempts failed.`));
    }
  }

  if (prs && prs.length) {
    for (const pr of prs) {
      out.push(card('warn', 'Work is finished but not turned on',
        `<a href="${pr.html_url}">#${pr.number} — ${pr.title}</a><br>Waiting on you. Nothing it fixes takes effect until it is merged.`));
    }
  }

  if (out.length === 1 && site.ok === true) out.push(card('good','Nothing else is broken','No failing helpers, no work waiting on you.'));
  el('broken').innerHTML = out.join('');

  // Who's working — last real activity, not a claim of activity.
  if (runs) {
    const seen = new Map();
    for (const r of runs.workflow_runs) {
      const who = /Gemini/i.test(r.name) ? 'Gemini' : /Claude/i.test(r.name) ? 'Claude' : /Codex/i.test(r.name) ? 'Codex' : null;
      if (who && !seen.has(who)) seen.set(who, r);
    }
    const rows = [...seen.entries()].map(([who, r]) => {
      const state = r.status !== 'completed' ? 'working right now'
        : r.conclusion === 'success' ? 'finished ' + ago(r.created_at)
        : 'failed ' + ago(r.created_at);
      return `<div class="who"><span class="name">${who}</span><span class="what">${state}</span></div>`;
    });
    el('who').innerHTML = rows.length ? rows.join('')
      : '<span class="detail">No agent has run through GitHub recently.</span>';
  }

  el('stamp').textContent = 'checked ' + new Date().toLocaleTimeString();
}

/*
 * Buttons deliberately do not describe agents, branches, or protocols. The owner
 * presses the outcome they want; routing is our problem, not theirs.
 */
const TASKS = [
  { head:'Check the website right now', why:'Re-runs every check against the live site.', run: load },
];
el('buttons').innerHTML = TASKS.map((t,i) =>
  `<button data-i="${i}"><span class="bhead">${t.head}</span><span class="bwhy">${t.why}</span></button>`).join('');
el('buttons').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const t = TASKS[+b.dataset.i]; const label = b.innerHTML;
  b.disabled = true; b.innerHTML = '<span class="bhead">working…</span>';
  try { await t.run(); } finally { b.disabled = false; b.innerHTML = label; }
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
