<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The most-read text on this site, and for a while the ONLY text some
      readers get. This is a React app, so a crawler that does not run
      JavaScript sees an empty <div id="root"> and nothing else — the title,
      this description, and the <noscript> below are the whole page to them.

      That includes the automated classifiers school web filters rely on.
      sal0mander.com is currently blocked by at least one district as
      "categorized as Unknown"; the previous description said "cloud companion
      platform for the SAL0MANder learning puzzle application", which tells a
      classifier nothing about mathematics, students, or classrooms.

      Written plainly and accurately rather than stuffed with keywords: it
      describes what the product actually is, in the words a teacher would use.
    -->
    <meta
      name="description"
      content="SAL0MANder is a free classroom practice tool. Students answer questions to reveal a jigsaw puzzle, one piece at a time — in math, science, vocabulary, or any subject a teacher builds. No account and no sign-in needed; teachers share an activity with a single link."
    />
    <meta name="keywords" content="classroom activities, practice questions, math, science, vocabulary, review games, teachers, students, formative assessment, educational games" />
    <meta name="author" content="SAL0MANder" />
    <meta name="robots" content="index, follow" />

    <!-- Link previews, in Classroom / Teams / a text message to a parent. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAL0MANder" />
    <meta property="og:title" content="SAL0MANder — learning puzzles for the classroom" />
    <meta
      property="og:description"
      content="Students answer questions to reveal a jigsaw puzzle. Math, science, vocabulary — whatever a teacher builds. No account, no sign-in."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="light dark" />
    <title>SAL0MANder — Learning Puzzles for the Classroom</title>

    <!--
      Structured data. Google's guidance says organization data helps automated
      systems understand and distinguish an organization, and the same machine
      readability is what a web filter's classifier benefits from — this site is
      currently categorised "Unknown" by at least one district, which is an
      absence of information rather than a judgement.

      Deliberately minimal and true: name, what it is, the audience, and the
      contact routes that actually exist. No founding date, no logo URL, no
      social profiles, no aggregate rating — every one of those would be either
      invented or unverifiable, and structured data that overstates is worse
      than none.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://sal0mander.com/#organization",
            "name": "SAL0MANder",
            "url": "https://sal0mander.com/",
            "description": "SAL0MANder makes classroom practice activities in which students answer questions to uncover a jigsaw puzzle. Built by a high school math teacher, for any subject a teacher writes questions for.",
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "support@sal0mander.com",
                "availableLanguage": "English"
              },
              {
                "@type": "ContactPoint",
                "contactType": "privacy",
                "email": "privacy@sal0mander.com",
                "availableLanguage": "English"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://sal0mander.com/#website",
            "url": "https://sal0mander.com/",
            "name": "SAL0MANder",
            "publisher": { "@id": "https://sal0mander.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "LearningResource",
            "name": "SAL0MANder classroom activities",
            "url": "https://sal0mander.com/",
            "learningResourceType": "Activity",
            "educationalUse": "Practice",
            "isAccessibleForFree": true,
            "audience": [
              { "@type": "EducationalAudience", "educationalRole": "student" },
              { "@type": "EducationalAudience", "educationalRole": "teacher" }
            ],
            "about": ["Mathematics", "Science", "Vocabulary"],
            "publisher": { "@id": "https://sal0mander.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Real content, not an error. A non-JavaScript reader — a person with it
      disabled, or a classifier that does not execute scripts — otherwise gets a
      blank page, which is indistinguishable from a parked domain.
    -->
    <noscript>
      <h1>SAL0MANder — learning puzzles for the classroom</h1>
      <p>
        SAL0MANder is a free practice tool for teachers and students. Students
        answer questions to uncover a jigsaw puzzle, one piece at a time. There
        is no account to create and no sign-in: a teacher shares a link, and the
        class plays.
      </p>
      <p>
        Teachers build the questions, so an activity can cover any subject —
        mathematics such as integer operations, one-step inequalities and linear
        equations; science such as cell structure; or vocabulary review. Suitable
        for roughly grades 6 through 12.
      </p>
      <p>
        More about this site:
        <a href="/about">About</a> ·
        <a href="/privacy">Privacy and student data</a> ·
        <a href="/terms">Terms of use</a> ·
        <a href="mailto:support@sal0mander.com">Contact</a>
      </p>
      <p>
        This site needs JavaScript enabled to run the activities.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
